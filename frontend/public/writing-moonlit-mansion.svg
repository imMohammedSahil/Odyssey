<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Odyssey Theme Spec Gradients -->
    <radialGradient id="odysseySkyGlow" cx="50%" cy="48%" r="58%">
      <stop offset="0%" stop-color="#3D2400" />
      <stop offset="38%" stop-color="#241500" />
      <stop offset="72%" stop-color="#140C00" />
      <stop offset="100%" stop-color="#0D0D0D" />
    </radialGradient>

    <!-- Warm Glowing Candlelight inside Haunted House -->
    <radialGradient id="houseWindowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="45%" stop-color="#F7B919" />
      <stop offset="85%" stop-color="#B87700" />
      <stop offset="100%" stop-color="#734700" />
    </radialGradient>

    <!-- Celestial Moon Glow Filter -->
    <filter id="moonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#F7B919" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="0" stdDeviation="40" flood-color="#9DE869" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Sky Base: Abyssal Black -->
  <rect width="1920" height="1080" fill="#0D0D0D" />

  <!-- Atmospheric Sky Radial Warmth -->
  <rect width="1920" height="1080" fill="url(#odysseySkyGlow)" />

  <!-- Atmospheric Sky Concentric Glow Rings -->
  <circle cx="960" cy="500" r="580" fill="#2E1B00" opacity="0.8" />
  <circle cx="960" cy="500" r="510" fill="#523100" opacity="0.85" />
  <circle cx="960" cy="500" r="450" fill="#8A5300" opacity="0.9" />
  <circle cx="960" cy="500" r="405" fill="#BF7701" opacity="0.95" />

