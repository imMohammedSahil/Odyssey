  <circle cx="960" cy="500" r="335" fill="#FFC933" />
  <circle cx="960" cy="500" r="285" fill="#FFD858" />
  <circle cx="960" cy="500" r="225" fill="#FFF0A8" />
  <circle cx="960" cy="500" r="150" fill="#FFFBE6" />
  <circle cx="960" cy="500" r="75" fill="#F9F9F3" opacity="0.96" />

