<svg xmlns="http://www.w3.org/2000/svg" width="280" height="110" viewBox="0 0 280 110">
  <!-- Matte pumpkin clay fill (solid cartoon style like MOON RAZE) -->
  <rect width="280" height="110" fill="#F47424"/>

  <!-- Organic hand-drawn comic clay creases & drip folds -->
  <g fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Floating 'v' crease 1 (like in O and M of MOON RAZE) -->
    <path d="M 28,26 L 33,37 L 38,28"/>

    <!-- Gentle wavy clay drip loop 1 (curving smoothly, NOT a vertical bar) -->
    <path d="M 52,18 C 64,36 82,34 94,16"/>
    <!-- Small drip tongue hanging from fold -->
    <path d="M 70,35 C 72,48 76,48 78,35"/>

    <!-- Floating 'v' crease 2 -->
    <path d="M 124,32 L 129,43 L 135,34"/>

    <!-- Slanted wavy fold 2 (like in N and R) -->
    <path d="M 152,18 C 160,32 174,38 186,24"/>

    <!-- Subtle teardrop lobe 3 -->
    <path d="M 208,22 C 218,44 232,42 242,20"/>
    <path d="M 223,43 C 224,53 227,53 228,42"/>

    <!-- Floating 'v' crease 3 -->
    <path d="M 262,28 L 267,39 L 273,30"/>

    <!-- Bottom Row (staggered & sparse) -->
    <!-- Wavy melting contour (like in Z and E) -->
    <path d="M 14,72 C 28,86 44,78 58,84"/>

    <!-- Floating 'v' crease 4 -->
    <path d="M 86,75 L 91,86 L 96,77"/>

    <!-- Flowy curved clay crease -->
    <path d="M 118,68 C 130,86 148,84 160,66"/>
    <path d="M 136,85 C 138,96 142,96 144,84"/>

    <!-- Wavy horizontal clay crease (like in Z of MOON RAZE) -->
    <path d="M 188,76 C 200,68 214,88 228,78"/>

    <!-- Floating 'v' crease 5 -->
    <path d="M 248,70 L 253,81 L 259,72"/>
  </g>
</svg>