version: 2
updates:
  # Maintain dependencies for backend service
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-backend)"
    open-pull-requests-limit: 5

  # Maintain dependencies for frontend client
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-frontend)"
    open-pull-requests-limit: 5
